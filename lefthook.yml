# pre-commit：格式 + 类型 + Secret，全部秒级
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,jsx,json,css,md}"
      run: npx prettier --check {staged_files}
    typecheck:
      run: npx tsc --noEmit
    secret-scan:
      run: gitleaks protect --staged

# pre-push：测试，可至数十秒
pre-push:
  commands:
    test:
      run: npx vitest run

# commit-msg：Conventional Commit 校验
commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit
