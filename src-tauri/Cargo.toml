[package]
name = "revue-office"
version = "0.1.0"
license = "Apache-2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "revue_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
async-stream = "0.3"
futures = "0.3"
eventsource-stream = "0.2"

# Config
dotenvy = "0.15"

# Error handling
anyhow = "1"
thiserror = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "any", "chrono", "uuid", "json"] }

# Auth
jsonwebtoken = "9"
bcrypt = "0.16"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
regex = "1"
urlencoding = "2"
base64 = "0.22"
tokio-stream = "0.1"
mime_guess = "2"

# Document rendering and file extraction
docx-rs = "0.4"
rust_xlsxwriter = "0.79"
zip = "2"

# Other
async-trait = "0.1"
secrecy = "0.8"
keyring = "=1.2.1"
zeroize = "1"
sha2 = "0.10"
subtle = "2"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
